apiVersion: fission.io/v1
kind: Function
metadata:
  name: bluesky-harvester
spec:
  InvokeStrategy:
    ExecutionStrategy:
      ExecutorType: poolmgr
      MaxScale: 0
      MinScale: 0
      SpecializationTimeout: 120
      TargetCPUPercent: 0
    StrategyType: execution
  concurrency: 500
  environment:
    name: python39
    namespace: ""
  functionTimeout: 120
  idletimeout: 120
  package:
    functionName: bluesky_harvester.main
    packageref:
      name: bluesky-pkg
      namespace: ""
  requestsPerPod: 1
  resources: {}
  secrets:
  - name: es-secret
    namespace: ""
